#!/usr/bin/env yason.py

{% set volume_fraction = 0.3 %}
{% set abs_macroion_charge = 8 %} # actually -8
{% set n_macroions = 10 %}
{% set pi = 3.141592653589793 %}
{% set macroion_volume = 4.0 * pi / 3.0 * 20.0**3 %}
{% set box_length = (n_macroions * macroion_volume / volume_fraction)**(1/3) %}

geometry: {type: cuboid, length: {{ box_length }}}
mcloop: {macro: 10, micro: {{ micro_steps }}}
temperature: 298.15
random: {seed: fixed}

atomlist:
    - MP: {eps: 2.479, mw: 10000000, q: 0, sigma: 40} # mid-particle
    - NP: {eps: 2.479, mw: 0.001, q: -1, sigma: 4.0}  # negative particle
    - PP: {eps: 2.479, mw: 0.001, q: 1, sigma: 4.0}   # positive particle
    - UP: {eps: 2.479, mw: 0.001, q: 0, sigma: 4.0}   # uncharged particle
    - Na: {dp: 20, eps: 2.479, mw: 0.001, q: 1, sigma: 4.0}
    - Cl: {dp: 20, eps: 2.479, mw: 0.001, q: -1, sigma: 4.0}

energy:
    - nonbonded_coulombwca:
        wca: {mixing: LB}
        coulomb: {type: plain, epsr: 78.7}

moleculelist:
    - macroion: {insdir: [1,1,1], structure: {{ structure }}, rigid: true}
    - cation: {atomic: true, atoms: [Na], activity: 0.1}
    - anion: {atomic: true, atoms: [Cl], activity: 0.1}

insertmolecules:
    - macroion: {N: {{ n_macroions }}}
    - cation: {N: {{ 100 + n_macroions * abs_macroion_charge }}}
    - anion: {N: 100}

moves:
    - moltransrot: {molecule: macroion, dp: 5, dprot: 2}
    - transrot: {molecule: cation}
    - transrot: {molecule: anion}
    - rcmc: {repeat: 100}
    
reactionlist:
    - "= cation + anion" : {}

analysis:
    - systemenergy: {nstep: 100, file: energy.dat}
    - sanity: {nstep: 1000}
    - atom_density: {nstep: 100}
    - molrdf: {nstep: 1, dim: 3, dr: 0.5, file: rdf.dat, name1: macroion, name2: macroion}
    - atomrdf: {nstep: 10, dim: 3, dr: 0.1, file: rdf-nacl.dat, name1: Na, name2: Cl}
    - savestate: {file: confout.pqr}
    - savestate: {file: state.json}
    - qrfile: {nstep: 100}
    - xtcfile: {file: traj.xtc, nstep: 100}
    - multipole: {nstep: 100}
    - virtualvolume: {nstep: 1, dV: 0.1, file: pressure.dat.gz}
