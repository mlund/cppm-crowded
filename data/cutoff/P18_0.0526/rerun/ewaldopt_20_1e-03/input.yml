atoms:
  - {name: MP, mass: 1.0e7,  charge:  0.0, sigma: 40.0, epsilon: 2.479}
  - {name: NP, mass: 1.0e-3, charge: -1.0, sigma:  4.0, epsilon: 2.479}
  - {name: PP, mass: 1.0e-3, charge:  1.0, sigma:  4.0, epsilon: 2.479}
  - {name: UP, mass: 1.0e-3, charge:  0.0, sigma:  4.0, epsilon: 2.479}

molecules:
  - name: macroion
    degrees_of_freedom: Rigid
    has_com: true
    from_structure: "../../../P18.xyz"

system:
  cell: !Cuboid [149.64407707272974, 149.64407707272974, 149.64407707272974]
  medium:
    permittivity: !Water
    temperature: 298.15
    salt: [!NaCl, 0.025556828357]
  blocks:
    - molecule: macroion
      N: 30
      insert: !GridCOM {rotate: true}
  energy:
    - !Nonbonded
      default:
        - !WeeksChandlerAndersen {mixing: LB}
    - !Ewald
      cutoff: 20.0
      accuracy: 0.001
      policy: PBC
      optimize: true

analysis:
  - !Energy
    file: energy.csv
    frequency: !Every 1
  # Compression by 10 Å³: f32 k-vectors blur smaller steps, and an expansion adds a
  # k-shell in fixed-α Ewald (mlund/coulomb#9)
  - !VirtualVolumeMove
    volume_displacement: -10
    method: Isotropic
    block_size: 50
    file: pressure.csv
    frequency: !Every 1

propagate:
  seed: !Hardware
  criterion: Metropolis
  steps: 1
  collections:
    - !Stochastic
      moves:
        - !TranslateMolecule {molecule: macroion, dp: 4.0, repeat: 30}
        - !RotateMolecule    {molecule: macroion, dprot: 0.4,  repeat: 30}
