# Bulk 1:1 electrolyte (~0.3 M NaCl) with grand-canonical Na+/Cl- pair
# insertion via reaction ensemble. Converted from C++ Faunus input.yml.
#
# The macroion atom/molecule definitions are carried over from the original
# but not placed (the original `insertmolecules` block had no macroion entry).

atoms:
  - {name: Na, mass: 22, charge:  1.0, sigma:  4.0, epsilon: 2.479}
  - {name: Cl, mass: 35, charge: -1.0, sigma:  4.0, epsilon: 2.479}

molecules:
  - name: Cations
    atoms: [Na]
    atomic: true
    activity: 0.1
  - name: Anions
    atoms: [Cl]
    atomic: true
    activity: 0.1

system:
  cell: !Cuboid [103.7574079781725, 103.7574079781725, 103.7574079781725]
  medium:
    permittivity: !Water
    temperature: 298.15

  blocks:
    - molecule: Cations
      N: 800
      active: 200
      insert: !RandomAtomPos {}
    - molecule: Anions
      N: 800
      active: 200
      insert: !RandomAtomPos {}

  energy:
    nonbonded:
      default:
        - !Coulomb {cutoff: 1000}
        - !WeeksChandlerAndersen {mixing: LB}

analysis:
  - !Energy
    file: energy.csv.gz
    frequency: !Every 100
  - !RadialDistribution
    selections: ["atomtype Na", "atomtype Cl"]
    file: rdf-nacl.csv
    dr: 0.1
    frequency: !Every 10
  - !CollectiveVariable
    property: molarity
    selection: "atomtype Na"
    frequency: !Every 10
  - !CollectiveVariable
    property: molarity
    selection: "atomtype Cl"
    frequency: !Every 10
  - !VirtualVolumeMove
    dV: 0.1
    method: Isotropic
    frequency: !Every 10

propagate:
  seed: !Fixed 42
  criterion: Metropolis
  repeat: 100
  collections:
    - !Stochastic
      moves:
        - !TranslateAtom {molecule: Cations, atom: Na, dp: 20.0}
        - !TranslateAtom {molecule: Anions,  atom: Cl, dp: 20.0}
    - !Deterministic
      moves:
        - !SpeciationMove
          temperature: 298.15
          repeat: 1000
          reactions:
            # Grand-canonical NaCl pair insertion; molecular activities
            # (0.1 M on Cations/Anions) are folded in automatically, so dG = 0.
            - ["= Cations + Anions", !dG 0.0]
